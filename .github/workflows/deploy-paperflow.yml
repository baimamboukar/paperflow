name: Deploy Paperflow to GitHub Pages

on:
  workflow_call:
    inputs:
      build-path:
        description: 'Path to built website files'
        required: false
        default: 'docs'
        type: string
      commit-hash:
        description: 'Commit hash that triggered the deployment'
        required: false
        type: string
      custom-domain:
        description: 'Custom domain for GitHub Pages'
        required: false
        type: string
      enable-jekyll:
        description: 'Enable Jekyll processing'
        required: false
        default: false
        type: boolean
    outputs:
      deployment-url:
        description: 'URL where the site was deployed'
        value: ${{ jobs.deploy.outputs.deployment-url }}
      deployment-success:
        description: 'Whether deployment was successful'
        value: ${{ jobs.deploy.outputs.deployment-success }}

  # Allow manual deployment
  workflow_dispatch:
    inputs:
      build-path:
        description: 'Path to built website files'
        required: false
        default: 'docs'
        type: string
      custom-domain:
        description: 'Custom domain for GitHub Pages'
        required: false
        type: string
      enable-jekyll:
        description: 'Enable Jekyll processing'
        required: false
        default: false
        type: boolean

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Prepare deployment
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.check-pages.outputs.enabled }}
      deployment-url: ${{ steps.check-pages.outputs.url }}
      build-exists: ${{ steps.check-build.outputs.exists }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if GitHub Pages is enabled
        id: check-pages
        run: |
          # Use GitHub API to check if Pages is enabled
          REPO_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}")
          
          HAS_PAGES=$(echo "$REPO_INFO" | jq -r '.has_pages // false')
          
          if [ "$HAS_PAGES" = "true" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            
            # Try to get the Pages URL
            PAGES_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pages" 2>/dev/null || echo '{}')
            
            PAGES_URL=$(echo "$PAGES_INFO" | jq -r '.html_url // ""')
            if [ -z "$PAGES_URL" ]; then
              # Construct default URL
              REPO_NAME="${{ github.repository }}"
              REPO_OWNER=$(echo "$REPO_NAME" | cut -d'/' -f1)
              REPO_NAME_ONLY=$(echo "$REPO_NAME" | cut -d'/' -f2)
              PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME_ONLY}"
            fi
            
            echo "url=$PAGES_URL" >> $GITHUB_OUTPUT
            echo "✅ GitHub Pages is enabled"
            echo "📍 URL: $PAGES_URL"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "❌ GitHub Pages is not enabled for this repository"
            echo "Please enable GitHub Pages in repository settings"
          fi

      - name: Check build files
        id: check-build
        run: |
          BUILD_PATH="${{ inputs.build-path || 'docs' }}"
          
          if [ -d "$BUILD_PATH" ] && [ -f "$BUILD_PATH/index.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Build files found in $BUILD_PATH"
            
            # List key files
            echo "📁 Build contents:"
            ls -la "$BUILD_PATH"
            
            # Check file sizes
            HTML_SIZE=$(stat -f%z "$BUILD_PATH/index.html" 2>/dev/null || stat -c%s "$BUILD_PATH/index.html")
            echo "📄 index.html size: ${HTML_SIZE} bytes"
            
            if [ -f "$BUILD_PATH/paper.pdf" ]; then
              PDF_SIZE=$(stat -f%z "$BUILD_PATH/paper.pdf" 2>/dev/null || stat -c%s "$BUILD_PATH/paper.pdf")
              echo "📄 paper.pdf size: ${PDF_SIZE} bytes"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Build files not found in $BUILD_PATH"
            echo "Expected structure:"
            echo "  $BUILD_PATH/"
            echo "    ├── index.html"
            echo "    ├── assets/"
            echo "    └── paper.pdf (optional)"
          fi

  # Main deployment job
  deploy:
    needs: prepare
    if: needs.prepare.outputs.pages-enabled == 'true' && needs.prepare.outputs.build-exists == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployment-url: ${{ steps.deployment.outputs.page_url }}
      deployment-success: ${{ steps.deploy-result.outputs.success }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Automatically infer the static site generator
          enablement: true

      - name: Prepare deployment files
        run: |
          BUILD_PATH="${{ inputs.build-path || 'docs' }}"
          
          echo "Preparing deployment from: $BUILD_PATH"
          
          # Create deployment info
          cat > "$BUILD_PATH/deployment-info.json" << EOF
          {
            "deployedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "deployedFrom": "${{ inputs.commit-hash || github.sha }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "repository": "${{ github.repository }}",
            "deploymentUrl": "${{ needs.prepare.outputs.deployment-url }}"
          }
          EOF
          
          # Add .nojekyll file if Jekyll is disabled
          if [ "${{ inputs.enable-jekyll }}" = "false" ]; then
            touch "$BUILD_PATH/.nojekyll"
            echo "✅ Added .nojekyll file (Jekyll disabled)"
          fi
          
          # Add custom domain file if specified
          if [ -n "${{ inputs.custom-domain }}" ]; then
            echo "${{ inputs.custom-domain }}" > "$BUILD_PATH/CNAME"
            echo "✅ Added CNAME file for custom domain: ${{ inputs.custom-domain }}"
          fi
          
          # Add robots.txt if it doesn't exist
          if [ ! -f "$BUILD_PATH/robots.txt" ]; then
            cat > "$BUILD_PATH/robots.txt" << EOF
          User-agent: *
          Allow: /
          
          Sitemap: ${{ needs.prepare.outputs.deployment-url }}/sitemap.xml
          EOF
            echo "✅ Added robots.txt"
          fi
          
          # Create a basic sitemap if it doesn't exist
          if [ ! -f "$BUILD_PATH/sitemap.xml" ]; then
            cat > "$BUILD_PATH/sitemap.xml" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>${{ needs.prepare.outputs.deployment-url }}/</loc>
              <lastmod>$(date -u +'%Y-%m-%d')</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          EOF
            echo "✅ Added sitemap.xml"
          fi

      - name: Add deployment badge
        run: |
          BUILD_PATH="${{ inputs.build-path || 'docs' }}"
          
          # Create deployment status page
          cat > "$BUILD_PATH/deployment-status.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Deployment Status</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .status { padding: 20px; border-radius: 8px; margin: 20px 0; }
                  .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
                  .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
                  .badge-success { background: #28a745; color: white; }
              </style>
          </head>
          <body>
              <h1>Paperflow Deployment Status</h1>
              <div class="status success">
                  <h2>✅ Successfully Deployed</h2>
                  <p><strong>Deployed at:</strong> $(date -u +'%Y-%m-%d %H:%M:%S UTC')</p>
                  <p><strong>From commit:</strong> ${{ inputs.commit-hash || github.sha }}</p>
                  <p><strong>Workflow:</strong> ${{ github.run_id }}</p>
                  <p><strong>Repository:</strong> ${{ github.repository }}</p>
              </div>
              <p><a href="index.html">← Back to Paper</a></p>
          </body>
          </html>
          EOF

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.build-path || 'docs' }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        id: deploy-result
        run: |
          DEPLOYMENT_URL="${{ steps.deployment.outputs.page_url }}"
          
          echo "🔗 Deployment URL: $DEPLOYMENT_URL"
          
          # Wait a moment for deployment to propagate
          sleep 10
          
          # Test the deployment
          echo "Testing deployment..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL" || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deployment verified successfully"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Deployment might still be propagating (HTTP $HTTP_STATUS)"
            echo "This is normal for new deployments and should resolve shortly"
            echo "success=true" >> $GITHUB_OUTPUT  # Don't fail on propagation delay
          fi

      - name: Update repository description
        if: steps.deploy-result.outputs.success == 'true'
        run: |
          # Update repository description to include the Pages URL
          CURRENT_DESC=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" | jq -r '.description // ""')
          
          if [[ "$CURRENT_DESC" != *"${{ steps.deployment.outputs.page_url }}"* ]]; then
            NEW_DESC="$CURRENT_DESC | Live at: ${{ steps.deployment.outputs.page_url }}"
            
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}" \
              -d "{\"description\": \"$NEW_DESC\", \"homepage\": \"${{ steps.deployment.outputs.page_url }}\"}" \
              > /dev/null
            
            echo "✅ Updated repository description and homepage"
          fi

  # Handle deployment failures
  deployment-failed:
    needs: prepare
    if: needs.prepare.outputs.pages-enabled == 'false' || needs.prepare.outputs.build-exists == 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Report deployment issues
        run: |
          echo "❌ Deployment cannot proceed:"
          
          if [ "${{ needs.prepare.outputs.pages-enabled }}" = "false" ]; then
            echo "  - GitHub Pages is not enabled"
            echo "  - Please enable it in Settings → Pages"
          fi
          
          if [ "${{ needs.prepare.outputs.build-exists }}" = "false" ]; then
            echo "  - Build files not found in ${{ inputs.build-path || 'docs' }}"
            echo "  - Please run the build workflow first"
          fi
          
          echo ""
          echo "📝 To fix these issues:"
          echo "1. Go to Settings → Pages in your repository"
          echo "2. Select 'GitHub Actions' as the source"
          echo "3. Ensure your build workflow completed successfully"

      - name: Create deployment failure artifact
        run: |
          mkdir -p deployment-logs
          cat > deployment-logs/deployment-failure.md << 'EOF'
          # Deployment Failure Report
          
          **Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow:** ${{ github.workflow }}
          **Run ID:** ${{ github.run_id }}
          
          ## Issues Found
          
          - **Pages Enabled:** ${{ needs.prepare.outputs.pages-enabled }}
          - **Build Exists:** ${{ needs.prepare.outputs.build-exists }}
          
          ## Next Steps
          
          1. Enable GitHub Pages in repository settings
          2. Set source to "GitHub Actions"
          3. Ensure build workflow completes successfully
          4. Re-run this deployment workflow
          
          EOF

      - name: Upload failure logs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure-logs-${{ github.run_id }}
          path: deployment-logs/
          retention-days: 7

  # Notification job
  notify:
    needs: [prepare, deploy, deployment-failed]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Send deployment notification
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "🚀 **Deployment Successful!**"
            echo ""
            echo "📍 **Live URL:** ${{ needs.deploy.outputs.deployment-url }}"
            echo "⏰ **Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 **From commit:** ${{ inputs.commit-hash || github.sha }}"
            echo ""
            echo "Your research paper is now live on GitHub Pages!"
          elif [ "${{ needs.deployment-failed.result }}" = "success" ]; then
            echo "❌ **Deployment Failed**"
            echo ""
            echo "Please check the workflow logs and fix the issues mentioned."
            echo "Most common fixes:"
            echo "- Enable GitHub Pages in repository settings"
            echo "- Set source to 'GitHub Actions'"
            echo "- Ensure build artifacts exist"
          else
            echo "❓ **Deployment Status Unknown**"
            echo "Please check the workflow logs for details."
          fi